# Local Postgres for development and tests.
#
# Matches Neon's server version (18.x) so behaviour here reflects production.
# Port 5433 on the host — 5432 and 55432 are already taken by other projects.
#
#   docker compose up -d       start (applies migrations/ on first run)
#   docker compose down        stop, keep data
#   docker compose down -v     stop and wipe, so the next up re-applies migrations
#
# Credentials are deliberately trivial: this database is disposable and only
# ever listens on localhost. Nothing here is a secret.

services:
  db:
    image: postgres:18
    container_name: creativejourney-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cj
      POSTGRES_PASSWORD: cj_local_dev
      POSTGRES_DB: creativejourney
    ports:
      - "5433:5432"
    volumes:
      # Every .sql here runs alphabetically on FIRST init only (empty data dir).
      # Adding a migration later means `docker compose down -v` to re-run them.
      - ./migrations:/docker-entrypoint-initdb.d:ro
      # postgres:18+ images store data under a major-version subdirectory of
      # /var/lib/postgresql itself, not /var/lib/postgresql/data — mounting
      # the old path trips their "unused mount" guard and refuses to start.
      - cj_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cj -d creativejourney"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  cj_pgdata:
